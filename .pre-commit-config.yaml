# Hooks de pre-commit (SPEC.md §14, "Calidad").
# Instalación (Python 3.12, ver .python-version y requirements-dev.txt):
#   py -3.12 -m venv .venv
#   .venv\Scripts\python -m pip install -r requirements-dev.txt
#   .venv\Scripts\pre-commit install
# Ejecución manual: .venv\Scripts\pre-commit run --all-files
#
# Hooks genéricos (S1-01), ruff (S1-01) y mypy del backend (S1-03; incluye alembic/ desde S1-04).
# ESLint/Prettier (frontend) se agregan en S1-05; CI los ejecuta igualmente (S1-06).

# Los entornos de los hooks se crean con Python 3.12, aunque el sistema tenga otra versión por defecto.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(backend|scripts)/
      - id: ruff-format
        files: ^(backend|scripts)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/
        args: [--config-file=backend/pyproject.toml]
        # Mismas versiones que backend/requirements*.txt (mantenerlas sincronizadas).
        additional_dependencies:
          - fastapi==0.115.4
          - pydantic==2.9.2
          - pydantic-settings==2.6.1
          - sqlalchemy==2.0.36
          - alembic==1.13.3
          - pytest==8.3.3
          - httpx==0.27.2

  - repo: local
    hooks:
      - id: no-env-files
        name: Bloquear archivos .env (los secretos solo viven en .env local)
        entry: Los archivos .env no se versionan; use .env.example
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: (^|/)\.env\.example$
