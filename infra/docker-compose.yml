# Entorno local de Trulab Viajes (S1-02, docs/architecture.md §12).
#
# Uso desde la raíz del repositorio (el `.env` define COMPOSE_FILE=infra/docker-compose.yml):
#   docker compose up -d                 # base de datos + migraciones + API + frontend
# Sin COMPOSE_FILE en el .env:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#
# (`api` y `frontend` estuvieron en el perfil `app` hasta que existió su código: S1-03 y S1-05.)
# Roles de BD (S1-04): `postgres` es solo el superusuario de arranque (crea los roles con
# infra/db/init/10-roles.sh la primera vez). Las migraciones usan trulab_owner (servicio `migrate`)
# y la API usa trulab_app, sin privilegios de DDL ni BYPASSRLS.
# MinIO no se incluye: sus imágenes oficiales ya no se publican en registros públicos; en local se usa
# STORAGE_BACKEND=local (SPEC.md §14: "en local, MinIO o el sistema de archivos").

name: trulab-viajes

services:
  db:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trulab_viajes}
      # Superusuario de arranque: solo para inicializar y administrar, nunca para la app.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      # Roles que crea infra/db/init/10-roles.sh.
      OWNER_DB_USER: ${OWNER_DB_USER:-trulab_owner}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?Defina OWNER_DB_PASSWORD en .env}
      APP_DB_USER: ${APP_DB_USER:-trulab_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD en .env}
    ports:
      # Solo en localhost: la BD no queda expuesta a la red.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecuta solo con el volumen vacío; para reaplicarlo, ver infra/README.md.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - trulab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Aplica las migraciones pendientes (alembic upgrade head) con trulab_owner y termina.
  # La API arranca solo si terminó bien. También sirve para crear migraciones nuevas:
  #   docker compose run --rm migrate alembic revision --autogenerate -m "descripcion"
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
      target: dev
    env_file:
      - path: ../.env
        required: false
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    volumes:
      - ../backend:/app
    networks:
      - trulab
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
      target: dev
    env_file:
      - path: ../.env
        required: false
    environment:
      STORAGE_LOCAL_PATH: /data/storage
      # Mínimo privilegio: la API solo conoce las credenciales de trulab_app (DATABASE_URL).
      DATABASE_URL_MIGRATIONS: ""
      # Recarga de uvicorn sobre volúmenes montados desde Windows (no llegan eventos inotify).
      WATCHFILES_FORCE_POLLING: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
      - api-storage:/data/storage
    networks:
      - trulab
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      target: dev
    environment:
      # Vite solo expone VITE_* al navegador. La SPA llama a `/api/v1` en su propia origen y el
      # servidor de Vite reenvía `/api` a la API por la red interna (sin CORS en local).
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      # Solo para el proxy de Vite (lado servidor); no llega al navegador.
      API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      # node_modules vive en un volumen: los binarios nativos son de Linux, no de Windows.
      - frontend-node-modules:/app/node_modules
    networks:
      - trulab
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  trulab:
    name: trulab-viajes

volumes:
  pgdata:
  api-storage:
  frontend-node-modules:
