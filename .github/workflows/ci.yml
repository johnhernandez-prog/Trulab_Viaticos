# Integración continua de Trulab Viajes (S1-06).
#
# Jobs (todos deben pasar; cualquier error de calidad o prueba hace fallar la pipeline):
#   pre-commit   → los mismos hooks que en local: genéricos, ruff, mypy, Prettier, ESLint y tsc.
#   backend      → imagen Docker del backend; ruff, mypy, migraciones (ida, vuelta y `alembic check`)
#                  y pytest contra PostgreSQL 16 real, con los roles trulab_owner/trulab_app.
#   frontend     → Node 24: ESLint, tsc, Prettier, Vitest y build de producción.
#   integracion  → Docker Compose completo (db, migrate, api, frontend): humo de la SPA, del proxy
#                  /api y de que src/types/api.ts está al día con el OpenAPI real.
#
# El backend corre en Docker como en local (ADR-016): los pasos son los mismos comandos de
# backend/README.md e infra/README.md. Para reproducir un job en local, ver HANDOFF.md (S1-06).

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Una ejecución por rama y evento: un push nuevo cancela la anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Instalar pre-commit
        run: python -m pip install -r requirements-dev.txt

      - name: Instalar dependencias del frontend (las usan los hooks de Prettier, ESLint y tsc)
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  backend:
    name: backend (Docker + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Crear .env con contraseñas aleatorias
        run: python3 scripts/crear_env.py

      - name: Permitir escritura al usuario de los contenedores (uid 1000)
        # El código se monta como volumen y el runner es otro uid: cachés de ruff, mypy y pytest.
        run: chmod -R a+rwX backend

      - name: Construir imágenes del backend
        run: docker compose build api migrate

      - name: Levantar PostgreSQL, aplicar migraciones y arrancar la API
        # 10-roles.sh crea trulab_owner/trulab_app; `migrate` aplica `alembic upgrade head`.
        run: docker compose up -d --wait db api

      - name: ruff (lint y formato)
        run: |
          docker compose exec -T api ruff check .
          docker compose exec -T api ruff format --check .

      - name: mypy (strict)
        run: docker compose exec -T api mypy app tests alembic

      - name: Migraciones (sin cambios pendientes; downgrade y upgrade completos)
        run: >-
          docker compose run --rm migrate sh -c
          "alembic check && alembic downgrade base && alembic upgrade head && alembic check"

      - name: pytest (todas las pruebas, incluidas las que necesitan trulab_owner)
        run: docker compose run --rm migrate python -m pytest -ra

      - name: Salud de la API con trulab_app
        run: |
          salud=$(curl -fsS http://127.0.0.1:8000/api/v1/health)
          echo "$salud"
          grep -q '"db":"ok"' <<<"$salud"

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar el entorno
        if: always()
        run: docker compose down -v

  frontend:
    name: frontend (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: TypeScript (tsc -b)
        run: npm run typecheck

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm test

      - name: Build de producción
        run: npm run build

  integracion:
    name: integración (Docker Compose)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Crear .env con contraseñas aleatorias
        run: python3 scripts/crear_env.py

      - name: Permitir escritura al usuario de los contenedores (uid 1000)
        run: chmod -R a+rwX backend frontend

      - name: Construir todas las imágenes
        run: docker compose build

      - name: Levantar el entorno completo
        run: docker compose up -d --wait

      - name: Humo de la SPA y del proxy /api
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:5173/
          curl -fsS -o /dev/null http://127.0.0.1:5173/legalizaciones/123
          salud=$(curl -fsS http://127.0.0.1:5173/api/v1/health)
          echo "$salud"
          grep -q '"db":"ok"' <<<"$salud"
          curl -fsS -o /dev/null http://127.0.0.1:5173/api/v1/openapi.json

      - name: Tipos del frontend al día con el OpenAPI de la API
        run: |
          docker compose exec -T frontend npm run gen:api
          git diff --exit-code -- frontend/src/types/api.ts \
            || { echo "::error::src/types/api.ts no coincide con la API: ejecute 'docker compose exec frontend npm run gen:api' y versione el resultado"; exit 1; }

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar el entorno
        if: always()
        run: docker compose down -v
