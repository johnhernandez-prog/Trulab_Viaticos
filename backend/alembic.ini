# Configuración de Alembic (S1-04). Se ejecuta desde backend/ (dentro de los contenedores, /app).
# La URL de conexión NO va aquí: env.py la lee de DATABASE_URL_MIGRATIONS (rol trulab_owner).
# Comandos del equipo: ver backend/README.md, sección "Migraciones".

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

# Nombre de archivo AAAAMMDD_HHMM_<descripcion> (docs/database-design.md §9).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
# Las migraciones nuevas salen ya formateadas y sin imports sobrantes (mismo ruff que pre-commit).
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

# Los logs de Alembic van a stderr en texto; la API usa su propio formato JSON (app/core/logs.py).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
