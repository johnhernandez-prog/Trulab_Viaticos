# Configuración de herramientas del backend. Las dependencias se declaran en requirements*.txt
# (contrato con infra/docker/backend.Dockerfile).

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.isort]
# backend/alembic/ (migraciones) no es el paquete `alembic`: que isort no lo tome como propio.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: las pruebas usan contraseñas y tokens ficticios a propósito.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Resuelve `app` y `tests` desde backend/, tanto en el contenedor como en el hook de pre-commit
# (que se ejecuta desde la raíz del repositorio).
mypy_path = "$MYPY_CONFIG_FILE_DIR"
explicit_package_bases = true

# Sin anotaciones de tipos publicadas: se tratan como `Any` en sus fronteras (S1-08).
[[tool.mypy.overrides]]
module = ["google.*", "boto3", "boto3.*", "botocore.*", "weasyprint", "weasyprint.*", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
